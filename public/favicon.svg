<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Eye mark">
  <!-- Drawn in code. Colours mirror --bg, --maroon, --blood and --bone
       in src/styles/tokens.css; an SVG favicon cannot read CSS variables. -->
  <style>
    .bg {
      fill: #070707;
    }
    .lid {
      fill: #3a0000;
      stroke: #e10600;
    }
    .iris {
      fill: #e10600;
    }
    .pupil {
      fill: #070707;
    }
    @media (prefers-color-scheme: light) {
      .bg {
        fill: #f7f5f2;
      }
      .lid {
        fill: #f0e6e4;
        stroke: #a80000;
      }
      .iris {
        fill: #a80000;
      }
      .pupil {
        fill: #f7f5f2;
      }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7" />
  <path
    class="lid"
    d="M4 16c3.6-5.4 7.6-8 12-8s8.4 2.6 12 8c-3.6 5.4-7.6 8-12 8s-8.4-2.6-12-8Z"
    stroke-width="1.6"
  />
  <circle class="iris" cx="16" cy="16" r="4.6" />
  <circle class="pupil" cx="16" cy="16" r="1.9" />
</svg>
